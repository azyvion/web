<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Darse de baja — Azyvion</title>
<meta name="description" content="Solicita darte de baja de las comunicaciones de Azyvion.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0B163D">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--color-primary:#0B163D;--color-secondary:#2979FF;--color-border:#E5E7EB;--font-display:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);color:#111827;background:#F8FAFC;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;-webkit-font-smoothing:antialiased;}
.card{background:#fff;border:1px solid var(--color-border);border-radius:20px;padding:2.5rem 2rem;max-width:480px;width:100%;text-align:center;box-shadow:0 4px 20px rgba(11,22,61,.07);}
.card svg{margin:0 auto 1.5rem;}
.card h1{font-family:var(--font-display);font-size:1.6rem;color:var(--color-primary);margin-bottom:.75rem;}
.card p{color:#667085;font-size:.95rem;line-height:1.65;margin-bottom:1.5rem;}
.form-group{display:flex;flex-direction:column;gap:.5rem;text-align:left;margin-bottom:1.25rem;}
.form-group label{font-size:.85rem;font-weight:600;color:var(--color-primary);}
.form-group input{padding:.8rem 1rem;border:1.5px solid var(--color-border);border-radius:10px;font-size:.95rem;transition:border-color .2s;}
.form-group input:focus{border-color:var(--color-secondary);outline:none;}
.btn{width:100%;padding:.8rem;background:var(--color-primary);color:#fff;border:none;border-radius:999px;font-family:var(--font-display);font-size:.92rem;font-weight:600;cursor:pointer;transition:background .2s;}
.btn:hover{background:#0e1e52;}
.note{margin-top:1rem;font-size:.82rem;color:#9CA3AF;}
.note a{color:var(--color-secondary);}
.success{display:none;color:#059669;font-weight:600;margin-top:1rem;}
</style>
</head>
<body>
<div class="card">
  <svg width="48" height="48" viewBox="0 0 48 48" fill="none" aria-hidden="true">
    <circle cx="24" cy="24" r="22" fill="#EFF6FF" stroke="#2979FF" stroke-width="1.5"/>
    <path d="M16 24H32M28 20L32 24L28 28" stroke="#2979FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Darse de baja</h1>
  <p>¿Ya no deseas recibir correos de Azyvion? Ingresa tu correo electrónico y procesaremos tu solicitud de baja en menos de 72 horas.</p>
  <form id="unsubForm">
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" placeholder="tu@correo.com" required autocomplete="email">
    </div>
    <input type="hidden" name="access_key" value="3566eb79-a149-4fc1-897b-edea9f1b90d4">
    <input type="hidden" name="subject" value="Solicitud de baja — Azyvion">
    <input type="hidden" name="message" value="El usuario solicita darse de baja de las comunicaciones de Azyvion.">
    <input type="checkbox" name="botcheck" style="display:none" tabindex="-1">
    <button type="submit" class="btn" id="unsubBtn">Solicitar baja</button>
    <p class="success" id="successMsg">✓ Tu solicitud fue recibida. Te daremos de baja en las próximas 72 horas.</p>
  </form>
  <p class="note">¿Cambio de opinión? Puedes <a href="index.html">volver al sitio</a> o escribirnos a <a href="mailto:hello@azyvion.com">hello@azyvion.com</a>.</p>
</div>
<script>
document.getElementById('unsubForm').addEventListener('submit', function(e){
  e.preventDefault();
  var btn = document.getElementById('unsubBtn');
  btn.textContent = 'Procesando...'; btn.disabled = true;
  fetch('https://api.web3forms.com/submit', {
    method:'POST', headers:{'Content-Type':'application/json',Accept:'application/json'},
    body: JSON.stringify(Object.fromEntries(new FormData(this)))
  }).then(function(r){return r.json();}).then(function(d){
    document.getElementById('successMsg').style.display = 'block';
    btn.style.display = 'none';
  }).catch(function(){
    btn.textContent = 'Error. Inténtalo de nuevo.'; btn.disabled = false;
  });
});
</script>
</body>
</html>
